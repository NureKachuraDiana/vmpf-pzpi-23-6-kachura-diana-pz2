<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Цитати дня за категорією</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #1f2937;
    }

    .container {
      max-width: 760px;
      margin: 60px auto;
      padding: 30px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #243b63;
    }

    .description {
      text-align: center;
      color: #5f6b7a;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 24px;
      background: #ffffff;
    }

    .quote-card {
      padding: 24px;
      border-left: 5px solid #3b82f6;
      background: #eff6ff;
      border-radius: 12px;
    }

    .quote-text {
      font-size: 22px;
      line-height: 1.5;
      margin: 0 0 14px 0;
      font-style: italic;
    }

    .quote-author {
      margin: 0;
      text-align: right;
      font-weight: bold;
      color: #334155;
    }

    .error {
      padding: 16px;
      border-radius: 10px;
      background: #fee2e2;
      color: #991b1b;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Цитата дня</h1>
    <p class="description">Оберіть категорію, щоб отримати цитату дня з JSON-файлу.</p>

    <label for="categorySelect">Категорія цитати:</label>
    <select id="categorySelect">
      <option value="">Завантаження категорій...</option>
    </select>

    <section id="quoteContainer" class="quote-card">
      <p class="quote-text">Дані завантажуються...</p>
      <p class="quote-author"></p>
    </section>
  </main>

  <script>
    const categorySelect = document.getElementById('categorySelect');
    const quoteContainer = document.getElementById('quoteContainer');

    let quotesData = [];

    function getDailyQuote(quotes) {
      const today = new Date();
      const dayNumber = today.getFullYear() + today.getMonth() + today.getDate();
      const quoteIndex = dayNumber % quotes.length;
      return quotes[quoteIndex];
    }

    function showQuoteByCategory(categoryId) {
      const selectedCategory = quotesData.find(category => category.id === categoryId);

      if (!selectedCategory || selectedCategory.quotes.length === 0) {
        quoteContainer.innerHTML = '<p class="error">Для цієї категорії цитати не знайдено.</p>';
        return;
      }

      const quote = getDailyQuote(selectedCategory.quotes);

      quoteContainer.innerHTML = `
        <p class="quote-text">«${quote.text}»</p>
        <p class="quote-author">— ${quote.author}</p>
      `;
    }

    function fillCategorySelect(categories) {
      categorySelect.innerHTML = '';

      categories.forEach(category => {
        const option = document.createElement('option');
        option.value = category.id;
        option.textContent = category.name;
        categorySelect.appendChild(option);
      });

      const urlParams = new URLSearchParams(window.location.search);
      const categoryFromUrl = urlParams.get('category');
      const defaultCategory = categories.some(category => category.id === categoryFromUrl)
        ? categoryFromUrl
        : categories[0].id;

      categorySelect.value = defaultCategory;
      showQuoteByCategory(defaultCategory);
    }

    fetch('quotes.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('Не вдалося завантажити JSON-файл');
        }
        return response.text();
      })
      .then(text => {
        const parsedData = JSON.parse(text);
        quotesData = parsedData.categories;
        fillCategorySelect(quotesData);
      })
      .catch(error => {
        quoteContainer.innerHTML = `<p class="error">Помилка: ${error.message}</p>`;
      });

    categorySelect.addEventListener('change', event => {
      showQuoteByCategory(event.target.value);
    });
  </script>
</body>
</html>
